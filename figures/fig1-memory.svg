<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="960" height="440" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">图 1　退出 ChatGPT/Codex 前后的内存账本对比（单位 GiB，Apple Silicon 页大小 16 KiB）</text>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="#6b7280">左柱＝BEFORE（66 个 Codex 进程在场，23:30）　右柱＝AFTER（Cmd+Q 完全退出后，23:33）</text>

  <!-- gridlines -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="340" x2="930" y2="340"/>
    <line x1="90" y1="295.2" x2="930" y2="295.2"/>
    <line x1="90" y1="250.4" x2="930" y2="250.4"/>
    <line x1="90" y1="205.6" x2="930" y2="205.6"/>
    <line x1="90" y1="160.8" x2="930" y2="160.8"/>
    <line x1="90" y1="116" x2="930" y2="116"/>
    <line x1="90" y1="71.2" x2="930" y2="71.2"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="82" y="344">0</text>
    <text x="82" y="299">2</text>
    <text x="82" y="254">4</text>
    <text x="82" y="210">6</text>
    <text x="82" y="165">8</text>
    <text x="82" y="120">10</text>
    <text x="82" y="75">12</text>
  </g>
  <line x1="90" y1="340" x2="90" y2="60" stroke="#9ca3af" stroke-width="1"/>
  <text x="30" y="200" font-size="12" fill="#374151" transform="rotate(-90 30 200)" text-anchor="middle">GiB</text>

  <!-- group 1: compressor occupied  6.21 vs 4.45 -->
  <rect x="122" y="200.9" width="48" height="139.1" fill="#d97706"/>
  <rect x="176" y="240.3" width="48" height="99.7"  fill="#2563eb"/>
  <text x="146" y="194" text-anchor="middle" font-size="11" fill="#92400e">6.21</text>
  <text x="200" y="234" text-anchor="middle" font-size="11" fill="#1e40af">4.45</text>
  <text x="173" y="360" text-anchor="middle" font-size="12" fill="#111827">压缩器物理占用</text>

  <!-- group 2: compressor stored 12.13 vs 8.83 -->
  <rect x="290" y="68.3" width="48" height="271.7" fill="#d97706"/>
  <rect x="344" y="142.2" width="48" height="197.8" fill="#2563eb"/>
  <text x="314" y="61" text-anchor="middle" font-size="11" fill="#92400e">12.13</text>
  <text x="368" y="135" text-anchor="middle" font-size="11" fill="#1e40af">8.83</text>
  <text x="341" y="360" text-anchor="middle" font-size="12" fill="#111827">压缩器持有的数据</text>

  <!-- group 3: swap used 4.50 vs 4.37 -->
  <rect x="458" y="239.2" width="48" height="100.8" fill="#d97706"/>
  <rect x="512" y="242.1" width="48" height="97.9"  fill="#2563eb"/>
  <text x="482" y="232" text-anchor="middle" font-size="11" fill="#92400e">4.50</text>
  <text x="536" y="235" text-anchor="middle" font-size="11" fill="#1e40af">4.37</text>
  <text x="509" y="360" text-anchor="middle" font-size="12" fill="#111827">swap 已用</text>

  <!-- group 4: free physical 0.24 vs 2.71 -->
  <rect x="626" y="334.6" width="48" height="5.4"  fill="#d97706"/>
  <rect x="680" y="279.3" width="48" height="60.7" fill="#2563eb"/>
  <text x="650" y="328" text-anchor="middle" font-size="11" fill="#92400e">0.24</text>
  <text x="704" y="273" text-anchor="middle" font-size="11" fill="#1e40af">2.71</text>
  <text x="677" y="360" text-anchor="middle" font-size="12" fill="#111827">空闲物理内存</text>

  <!-- group 5: wired 2.42 vs 2.14 -->
  <rect x="794" y="285.8" width="48" height="54.2" fill="#d97706"/>
  <rect x="848" y="292.1" width="48" height="47.9" fill="#2563eb"/>
  <text x="818" y="279" text-anchor="middle" font-size="11" fill="#92400e">2.42</text>
  <text x="872" y="285" text-anchor="middle" font-size="11" fill="#1e40af">2.14</text>
  <text x="845" y="360" text-anchor="middle" font-size="12" fill="#111827">wired（不可换出）</text>

  <!-- legend -->
  <rect x="300" y="392" width="14" height="14" fill="#d97706"/>
  <text x="320" y="404" font-size="12" fill="#374151">BEFORE：ChatGPT/Codex 在场（66 进程 / 5.6 GiB footprint）</text>
  <rect x="620" y="392" width="14" height="14" fill="#2563eb"/>
  <text x="640" y="404" font-size="12" fill="#374151">AFTER：完全退出后（0 进程）</text>

  <text x="480" y="428" text-anchor="middle" font-size="11" fill="#6b7280">内存压力 free%：45% → 55%　｜　压缩器占用下降 1.76 GiB，空闲内存增加 2.47 GiB</text>
</svg>
