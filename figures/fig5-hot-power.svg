<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">图 5　热态实测：SoC 功耗确实升高（×3.1），但热压等级始终 Nominal</text>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="#6b7280">左：SoC 总功耗（CPU+GPU+ANE，powermetrics）　右：WindowServer 主线程时间构成的变化</text>

  <!-- PANEL A -->
  <text x="60" y="82" font-size="12.5" font-weight="600" fill="#111827">左：SoC 总功耗</text>
  <line x1="70" y1="330" x2="450" y2="330" stroke="#9ca3af"/>
  <g stroke="#e5e7eb">
    <line x1="70" y1="256.7" x2="450" y2="256.7"/>
    <line x1="70" y1="183.3" x2="450" y2="183.3"/>
    <line x1="70" y1="110" x2="450" y2="110"/>
  </g>
  <g font-size="10" fill="#6b7280" text-anchor="end">
    <text x="64" y="334">0</text><text x="64" y="260">500</text><text x="64" y="187">1000</text><text x="64" y="114">1500 mW</text>
  </g>

  <!-- idle bar: mean 305, range 183-427 -->
  <rect x="130" y="285.3" width="80" height="44.7" fill="#2563eb"/>
  <line x1="170" y1="303.2" x2="170" y2="267.4" stroke="#111827" stroke-width="1.4"/>
  <line x1="158" y1="303.2" x2="182" y2="303.2" stroke="#111827" stroke-width="1.4"/>
  <line x1="158" y1="267.4" x2="182" y2="267.4" stroke="#111827" stroke-width="1.4"/>
  <text x="170" y="259" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">936 vs 305</text>
  <text x="170" y="278" text-anchor="middle" font-size="11" fill="#1e40af">均值 305</text>
  <text x="170" y="350" text-anchor="middle" font-size="11" fill="#111827">Codex 闲置</text>
  <text x="170" y="365" text-anchor="middle" font-size="10" fill="#6b7280">23:24　5 次采样</text>

  <!-- active bar: mean 936, range 711-1485 -->
  <rect x="290" y="192.7" width="80" height="137.3" fill="#dc2626"/>
  <line x1="330" y1="225.7" x2="330" y2="112.2" stroke="#111827" stroke-width="1.4"/>
  <line x1="318" y1="225.7" x2="342" y2="225.7" stroke="#111827" stroke-width="1.4"/>
  <line x1="318" y1="112.2" x2="342" y2="112.2" stroke="#111827" stroke-width="1.4"/>
  <text x="330" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">均值 936</text>
  <text x="330" y="350" text-anchor="middle" font-size="11" fill="#111827">任务活跃</text>
  <text x="330" y="365" text-anchor="middle" font-size="10" fill="#6b7280">23:53　8 次采样</text>
  <text x="395" y="120" font-size="10.5" fill="#374151">max 1485</text>
  <text x="395" y="232" font-size="10.5" fill="#374151">min 711</text>

  <text x="260" y="392" text-anchor="middle" font-size="11.5" fill="#374151">活跃期 = 空闲期的 <tspan font-weight="600">3.1 倍</tspan>，但绝对量仅 ≈0.94 W</text>

  <!-- PANEL B -->
  <text x="520" y="82" font-size="12.5" font-weight="600" fill="#111827">右：WindowServer 主线程时间构成</text>

  <text x="530" y="118" font-size="11" fill="#111827">Codex 闲置（23:23:52，3916 采样）</text>
  <rect x="530" y="126" width="272.6" height="34" fill="#9ca3af"/>
  <rect x="802.6" y="126" width="63.2" height="34" fill="#dc2626"/>
  <rect x="865.8" y="126" width="4.1" height="34" fill="#1f2937"/>
  <text x="666" y="148" text-anchor="middle" font-size="11" fill="#ffffff">等事件 80.2%</text>
  <text x="834" y="148" text-anchor="middle" font-size="10" fill="#ffffff">18.6%</text>

  <text x="530" y="196" font-size="11" fill="#111827">任务活跃（23:54，3190 采样）</text>
  <rect x="530" y="204" width="157.4" height="34" fill="#9ca3af"/>
  <rect x="687.4" y="204" width="171.4" height="34" fill="#dc2626"/>
  <rect x="858.8" y="204" width="11.2" height="34" fill="#1f2937"/>
  <text x="608" y="226" text-anchor="middle" font-size="11" fill="#ffffff">等事件 46.3%</text>
  <text x="773" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">显示更新 50.4%</text>

  <text x="720" y="270" text-anchor="middle" font-size="11.5" fill="#374151">时间构成从「<tspan font-weight="600">以等待为主</tspan>」翻转为「<tspan font-weight="600">以显示更新/CA 合成为主</tspan>」</text>
  <text x="720" y="290" text-anchor="middle" font-size="11" fill="#6b7280">IOSurface（帧缓冲）在主线程里的出现次数：1 → 47</text>

  <rect x="60" y="320" width="840" height="130" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="480" y="344" font-size="12" font-weight="600" fill="#111827">热态三条实测结论</text>
  <text x="480" y="366" font-size="11.5" fill="#374151">① 热压等级 <tspan font-weight="600">Nominal ×8</tspan>：整场任务中系统从未进入热降频；`pmset -g therm` 也从未记录热警告</text>
  <text x="480" y="386" font-size="11.5" fill="#374151">② 功耗升高是真实的（×3.1），但绝对量只有 ≈0.94 W —— 与「跑满某个后台进程」的发热量级不符</text>
  <text x="480" y="406" font-size="11.5" fill="#374151">③ 与此同时 WindowServer 的 CPU 总量没有变化（42.7%），只是<tspan font-weight="600">构成</tspan>变了 → 采集链没有额外贡献</text>
  <text x="480" y="432" font-size="11" fill="#6b7280">因此「发烫」更可能来自：无风扇机身的散热条件（被褥/沙发/腿上）、屏幕背光与充电电路，以及短期突发负载，而不是某个进程失控</text>
</svg>
