<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">图 2　WindowServer 在 61 秒窗口内消耗的 CPU 时间（累计 CPU 时间差，最硬口径）</text>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="#6b7280">左：Codex 在场　右：Cmd+Q 完全退出 Codex 之后　—— 差异仅 1.87 CPU 秒，落在噪声范围内</text>

  <!-- gridlines: 0..61 CPU秒 -> 0..240px, px per sec = 3.934 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="120" y1="320" x2="880" y2="320"/>
    <line x1="120" y1="280" x2="880" y2="280"/>
    <line x1="120" y1="240" x2="880" y2="240"/>
    <line x1="120" y1="200" x2="880" y2="200"/>
    <line x1="120" y1="160" x2="880" y2="160"/>
    <line x1="120" y1="120" x2="880" y2="120"/>
    <line x1="120" y1="80" x2="880" y2="80"/>
  </g>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="112" y="324">0</text>
    <text x="112" y="284">10</text>
    <text x="112" y="244">20</text>
    <text x="112" y="204">30</text>
    <text x="112" y="164">40</text>
    <text x="112" y="124">50</text>
    <text x="112" y="84">60</text>
  </g>
  <line x1="120" y1="320" x2="120" y2="70" stroke="#9ca3af" stroke-width="1"/>
  <text x="46" y="200" font-size="12" fill="#374151" transform="rotate(-90 46 200)" text-anchor="middle">CPU 秒 / 61 秒窗口</text>

  <!-- full-core reference line at 61 sec = y 80 -->
  <line x1="120" y1="80" x2="880" y2="80" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="876" y="74" text-anchor="end" font-size="11" fill="#dc2626">1 个核心 100% 满载 = 61 CPU 秒</text>

  <!-- BEFORE bar: 26.80 sec -> 105.4 px -->
  <rect x="290" y="214.6" width="120" height="105.4" fill="#d97706"/>
  <text x="350" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">26.80 秒</text>
  <text x="350" y="342" text-anchor="middle" font-size="13" fill="#111827">BEFORE（Codex 在场）</text>
  <text x="350" y="360" text-anchor="middle" font-size="12" fill="#6b7280">= 单核 43.9%</text>

  <!-- AFTER bar: 24.93 sec -> 98.1 px -->
  <rect x="590" y="221.9" width="120" height="98.1" fill="#2563eb"/>
  <text x="650" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">24.93 秒</text>
  <text x="650" y="342" text-anchor="middle" font-size="13" fill="#111827">AFTER（Codex 已退出）</text>
  <text x="650" y="360" text-anchor="middle" font-size="12" fill="#6b7280">= 单核 40.9%</text>

  <!-- delta annotation -->
  <line x1="410" y1="265" x2="590" y2="265" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="500" y="256" text-anchor="middle" font-size="12" fill="#374151">Δ = 1.87 CPU 秒（−6.9%）</text>

  <text x="480" y="398" text-anchor="middle" font-size="12" fill="#111827">结论：ScreenCaptureKit 采集链（replayd 会话归零、SkyComputerUseService 消失）与 WindowServer 高占用<b>无因果关系</b></text>
</svg>
